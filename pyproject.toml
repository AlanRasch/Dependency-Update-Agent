[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "depagent"
version = "1.0.0"
description = "Finds outdated Python and npm dependencies, applies safe updates only when tests pass, and can open pull requests."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["packaging>=23.0"]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.scripts]
depagent = "depagent.cli:main"

[tool.setuptools]
packages = ["depagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
